services:
  frontend:
    build:
      context: ./frontend
      network: ${BDEN_BUILD_NETWORK:-default}
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://bden.hinkaku.tech}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BDEN_FRONTEND_HOST_PORT:-8088}:80"
    depends_on:
      - gateway
    networks:
      - bden_network

  auth-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - "127.0.0.1:${AUTH_DB_HOST_PORT:-15432}:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    networks:
      - bden_network

  donor-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DONOR_DB_NAME}
      POSTGRES_USER: ${DONOR_DB_USER}
      POSTGRES_PASSWORD: ${DONOR_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - "127.0.0.1:${DONOR_DB_HOST_PORT:-15433}:5432"
    volumes:
      - donor_db_data:/var/lib/postgresql/data
    networks:
      - bden_network

  request-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${REQUEST_DB_NAME}
      POSTGRES_USER: ${REQUEST_DB_USER}
      POSTGRES_PASSWORD: ${REQUEST_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - "127.0.0.1:${REQUEST_DB_HOST_PORT:-15434}:5432"
    volumes:
      - request_db_data:/var/lib/postgresql/data
    networks:
      - bden_network

  campaign-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CAMPAIGN_DB_NAME}
      POSTGRES_USER: ${CAMPAIGN_DB_USER}
      POSTGRES_PASSWORD: ${CAMPAIGN_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - "127.0.0.1:${CAMPAIGN_DB_HOST_PORT:-15435}:5432"
    volumes:
      - campaign_db_data:/var/lib/postgresql/data
    networks:
      - bden_network

  notification-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NOTIFICATION_DB_NAME}
      POSTGRES_USER: ${NOTIFICATION_DB_USER}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - "127.0.0.1:${NOTIFICATION_DB_HOST_PORT:-15436}:5432"
    volumes:
      - notification_db_data:/var/lib/postgresql/data
    networks:
      - bden_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - bden_network

  auth-service:
    build:
      context: ./services/auth-service
      network: ${BDEN_BUILD_NETWORK:-default}
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DEBUG: "False"
      SECURE_SSL_REDIRECT: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS},localhost,127.0.0.1,bden.hinkaku.tech
      FRONTEND_URL: ${FRONTEND_URL}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}
      AUTH_DB_NAME: ${AUTH_DB_NAME}
      AUTH_DB_USER: ${AUTH_DB_USER}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      AUTH_DB_HOST: 127.0.0.1
      AUTH_DB_PORT: ${AUTH_DB_HOST_PORT:-15432}
      DONOR_SERVICE_INTERNAL_URL: http://127.0.0.1:8002
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      REDIS_URL: redis://127.0.0.1:${REDIS_HOST_PORT:-16379}/0
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GOOGLE_AUTH_FRONTEND_CALLBACK_URL: ${GOOGLE_AUTH_FRONTEND_CALLBACK_URL:-}
      WAIT_FOR_HOSTS: 127.0.0.1:${AUTH_DB_HOST_PORT:-15432},127.0.0.1:${REDIS_HOST_PORT:-16379}
    command: >
      sh -c "python wait_for.py &&
             python manage.py migrate &&
             python manage.py collectstatic --no-input &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8001 --workers ${GUNICORN_WORKERS:-3}"
    depends_on:
      auth-db:
        condition: service_healthy
      donor-service:
        condition: service_started
      redis:
        condition: service_healthy
    network_mode: host

  donor-service:
    build:
      context: ./services/donor-service
      network: ${BDEN_BUILD_NETWORK:-default}
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DEBUG: "False"
      SECURE_SSL_REDIRECT: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS},localhost,127.0.0.1,bden.hinkaku.tech
      FRONTEND_URL: ${FRONTEND_URL}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}
      DONOR_SECRET_KEY: ${DONOR_SECRET_KEY}
      DONOR_DB_NAME: ${DONOR_DB_NAME}
      DONOR_DB_USER: ${DONOR_DB_USER}
      DONOR_DB_PASSWORD: ${DONOR_DB_PASSWORD}
      DONOR_DB_HOST: 127.0.0.1
      DONOR_DB_PORT: ${DONOR_DB_HOST_PORT:-15433}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      REDIS_URL: redis://127.0.0.1:${REDIS_HOST_PORT:-16379}/0
      REDIS_CACHE_URL: redis://127.0.0.1:${REDIS_HOST_PORT:-16379}/1
      AUTH_SERVICE_INTERNAL_URL: http://127.0.0.1:8001
      REQUEST_SERVICE_INTERNAL_URL: http://127.0.0.1:8003
      DEFAULT_MATCHING_RADIUS_KM: ${DEFAULT_MATCHING_RADIUS_KM:-30}
      MAX_MATCHING_RADIUS_KM: ${MAX_MATCHING_RADIUS_KM:-100}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL_NAME: ${GEMINI_MODEL_NAME:-gemini-1.5-flash}
      WAIT_FOR_HOSTS: 127.0.0.1:${DONOR_DB_HOST_PORT:-15433},127.0.0.1:${REDIS_HOST_PORT:-16379}
    command: >
      sh -c "python wait_for.py &&
             python manage.py migrate &&
             python manage.py collectstatic --no-input &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8002 --workers ${GUNICORN_WORKERS:-3}"
    depends_on:
      donor-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    network_mode: host

  donor-event-consumer:
    build:
      context: ./services/donor-service
      network: ${BDEN_BUILD_NETWORK:-default}
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS},localhost,127.0.0.1,bden.hinkaku.tech
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}
      DONOR_SECRET_KEY: ${DONOR_SECRET_KEY}
      DONOR_DB_NAME: ${DONOR_DB_NAME}
      DONOR_DB_USER: ${DONOR_DB_USER}
      DONOR_DB_PASSWORD: ${DONOR_DB_PASSWORD}
      DONOR_DB_HOST: 127.0.0.1
      DONOR_DB_PORT: ${DONOR_DB_HOST_PORT:-15433}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      REDIS_URL: redis://127.0.0.1:${REDIS_HOST_PORT:-16379}/0
      REDIS_CACHE_URL: redis://127.0.0.1:${REDIS_HOST_PORT:-16379}/1
      WAIT_FOR_HOSTS: 127.0.0.1:${DONOR_DB_HOST_PORT:-15433},127.0.0.1:${REDIS_HOST_PORT:-16379}
    command: sh -c "python wait_for.py && python manage.py consume_events"
    depends_on:
      donor-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    network_mode: host

  request-service:
    build:
      context: ./services/request-service
      network: ${BDEN_BUILD_NETWORK:-default}
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS},localhost,127.0.0.1,bden.hinkaku.tech
      FRONTEND_URL: ${FRONTEND_URL}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}
      REQUEST_SECRET_KEY: ${REQUEST_SECRET_KEY}
      REQUEST_DB_NAME: ${REQUEST_DB_NAME}
      REQUEST_DB_USER: ${REQUEST_DB_USER}
      REQUEST_DB_PASSWORD: ${REQUEST_DB_PASSWORD}
      REQUEST_DB_HOST: 127.0.0.1
      REQUEST_DB_PORT: ${REQUEST_DB_HOST_PORT:-15434}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      REDIS_URL: redis://127.0.0.1:${REDIS_HOST_PORT:-16379}/0
      DONOR_SERVICE_URL: http://127.0.0.1:8002
      NOTIFICATION_SERVICE_URL: http://127.0.0.1:8005
      WAIT_FOR_HOSTS: 127.0.0.1:${REQUEST_DB_HOST_PORT:-15434},127.0.0.1:${REDIS_HOST_PORT:-16379}
    command: >
      sh -c "python wait_for.py &&
             python manage.py migrate &&
             python manage.py collectstatic --no-input &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8003 --workers ${GUNICORN_WORKERS:-3}"
    depends_on:
      request-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    network_mode: host

  request-event-consumer:
    build:
      context: ./services/request-service
      network: ${BDEN_BUILD_NETWORK:-default}
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS},localhost,127.0.0.1,bden.hinkaku.tech
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}
      REQUEST_SECRET_KEY: ${REQUEST_SECRET_KEY}
      REQUEST_DB_NAME: ${REQUEST_DB_NAME}
      REQUEST_DB_USER: ${REQUEST_DB_USER}
      REQUEST_DB_PASSWORD: ${REQUEST_DB_PASSWORD}
      REQUEST_DB_HOST: 127.0.0.1
      REQUEST_DB_PORT: ${REQUEST_DB_HOST_PORT:-15434}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      REDIS_URL: redis://127.0.0.1:${REDIS_HOST_PORT:-16379}/0
      WAIT_FOR_HOSTS: 127.0.0.1:${REQUEST_DB_HOST_PORT:-15434},127.0.0.1:${REDIS_HOST_PORT:-16379}
    command: sh -c "python wait_for.py && python manage.py consume_events"
    depends_on:
      request-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    network_mode: host

  campaign-service:
    build:
      context: ./services/campaign-service
      network: ${BDEN_BUILD_NETWORK:-default}
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DEBUG: "False"
      SECURE_SSL_REDIRECT: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS},localhost,127.0.0.1,bden.hinkaku.tech
      FRONTEND_URL: ${FRONTEND_URL}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}
      CAMPAIGN_SECRET_KEY: ${CAMPAIGN_SECRET_KEY}
      CAMPAIGN_DB_NAME: ${CAMPAIGN_DB_NAME}
      CAMPAIGN_DB_USER: ${CAMPAIGN_DB_USER}
      CAMPAIGN_DB_PASSWORD: ${CAMPAIGN_DB_PASSWORD}
      CAMPAIGN_DB_HOST: 127.0.0.1
      CAMPAIGN_DB_PORT: ${CAMPAIGN_DB_HOST_PORT:-15435}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      REDIS_URL: redis://127.0.0.1:${REDIS_HOST_PORT:-16379}/0
      DONOR_SERVICE_INTERNAL_URL: http://127.0.0.1:8002
      WAIT_FOR_HOSTS: 127.0.0.1:${CAMPAIGN_DB_HOST_PORT:-15435},127.0.0.1:${REDIS_HOST_PORT:-16379}
    command: >
      sh -c "python wait_for.py &&
             python manage.py migrate &&
             python manage.py collectstatic --no-input &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8004 --workers ${GUNICORN_WORKERS:-3}"
    depends_on:
      campaign-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    network_mode: host

  notification-service:
    build:
      context: ./services/notification-service
      network: ${BDEN_BUILD_NETWORK:-default}
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS},localhost,127.0.0.1,bden.hinkaku.tech
      FRONTEND_URL: ${FRONTEND_URL}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}
      NOTIFICATION_SECRET_KEY: ${NOTIFICATION_SECRET_KEY}
      NOTIFICATION_DB_NAME: ${NOTIFICATION_DB_NAME}
      NOTIFICATION_DB_USER: ${NOTIFICATION_DB_USER}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      NOTIFICATION_DB_HOST: 127.0.0.1
      NOTIFICATION_DB_PORT: ${NOTIFICATION_DB_HOST_PORT:-15436}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      REDIS_URL: redis://127.0.0.1:${REDIS_HOST_PORT:-16379}/0
      WAIT_FOR_HOSTS: 127.0.0.1:${NOTIFICATION_DB_HOST_PORT:-15436},127.0.0.1:${REDIS_HOST_PORT:-16379}
    command: >
      sh -c "python wait_for.py &&
             python manage.py migrate &&
             python manage.py collectstatic --no-input &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8005 --workers ${GUNICORN_WORKERS:-3}"
    depends_on:
      notification-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    network_mode: host

  notification-event-consumer:
    build:
      context: ./services/notification-service
      network: ${BDEN_BUILD_NETWORK:-default}
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS},localhost,127.0.0.1,bden.hinkaku.tech
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}
      NOTIFICATION_SECRET_KEY: ${NOTIFICATION_SECRET_KEY}
      NOTIFICATION_DB_NAME: ${NOTIFICATION_DB_NAME}
      NOTIFICATION_DB_USER: ${NOTIFICATION_DB_USER}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      NOTIFICATION_DB_HOST: 127.0.0.1
      NOTIFICATION_DB_PORT: ${NOTIFICATION_DB_HOST_PORT:-15436}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      REDIS_URL: redis://127.0.0.1:${REDIS_HOST_PORT:-16379}/0
      WAIT_FOR_HOSTS: 127.0.0.1:${NOTIFICATION_DB_HOST_PORT:-15436},127.0.0.1:${REDIS_HOST_PORT:-16379}
    command: sh -c "python wait_for.py && python manage.py consume_events"
    depends_on:
      notification-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    network_mode: host

  gateway:
    build:
      context: ./infrastructure/nginx
      network: ${BDEN_BUILD_NETWORK:-default}
    restart: unless-stopped
    volumes:
      - ./infrastructure/nginx/nginx.host.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-service
      - donor-service
      - request-service
      - campaign-service
      - notification-service
    network_mode: host

volumes:
  auth_db_data:
  donor_db_data:
  request_db_data:
  campaign_db_data:
  notification_db_data:
  redis_data:

networks:
  bden_network:
    driver: bridge
