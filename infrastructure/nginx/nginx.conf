upstream auth_service {
    server auth-service:8001;
}

upstream donor_service {
    server donor-service:8002;
}

upstream request_service {
    server request-service:8003;
}

upstream campaign_service {
    server campaign-service:8004;
}

upstream notification_service {
    server notification-service:8005;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    location = / {
        default_type application/json;
        return 200 '{"service":"BDEN API Gateway","status":"ok","docs":"/api/docs/swagger/","health":{"auth":"/health/auth/","donor":"/health/donor/","request":"/health/request/","campaign":"/health/campaign/","notification":"/health/notification/"}}';
    }

    location /api/donor/docs/ {
        proxy_pass http://donor_service/api/docs/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/donor/redoc/ {
        proxy_pass http://donor_service/api/redoc/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/docs/ {
        proxy_pass http://auth_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/schema.json {
        proxy_pass http://auth_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/auth/ {
        proxy_pass http://auth_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/admin/ {
        proxy_pass http://auth_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /reserved/auth/ {
        proxy_pass http://auth_service/django-admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect /django-admin/ /reserved/auth/;
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter '="/django-admin/' '="/reserved/auth/';
        sub_filter 'next=/django-admin/' 'next=/reserved/auth/';
        sub_filter 'next=%2Fdjango-admin%2F' 'next=%2Freserved%2Fauth%2F';
    }

    location /reserved/donor/ {
        proxy_pass http://donor_service/django-admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect /django-admin/ /reserved/donor/;
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter '="/django-admin/' '="/reserved/donor/';
        sub_filter 'next=/django-admin/' 'next=/reserved/donor/';
        sub_filter 'next=%2Fdjango-admin%2F' 'next=%2Freserved%2Fdonor%2F';
    }

    location /reserved/request/ {
        proxy_pass http://request_service/django-admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect /django-admin/ /reserved/request/;
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter '="/django-admin/' '="/reserved/request/';
        sub_filter 'next=/django-admin/' 'next=/reserved/request/';
        sub_filter 'next=%2Fdjango-admin%2F' 'next=%2Freserved%2Frequest%2F';
    }

    location /reserved/campaign/ {
        proxy_pass http://campaign_service/django-admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect /django-admin/ /reserved/campaign/;
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter '="/django-admin/' '="/reserved/campaign/';
        sub_filter 'next=/django-admin/' 'next=/reserved/campaign/';
        sub_filter 'next=%2Fdjango-admin%2F' 'next=%2Freserved%2Fcampaign%2F';
    }

    location /reserved/notification/ {
        proxy_pass http://notification_service/django-admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect /django-admin/ /reserved/notification/;
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter '="/django-admin/' '="/reserved/notification/';
        sub_filter 'next=/django-admin/' 'next=/reserved/notification/';
        sub_filter 'next=%2Fdjango-admin%2F' 'next=%2Freserved%2Fnotification%2F';
    }

    location /static/ {
        proxy_pass http://auth_service/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/donors/ {
        proxy_pass http://donor_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/estimation/ {
        proxy_pass http://donor_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/requests/ {
        proxy_pass http://request_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/campaigns/ {
        proxy_pass http://campaign_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/myths/ {
        proxy_pass http://campaign_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ads/ {
        proxy_pass http://campaign_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/campaign/docs/ {
        proxy_pass http://campaign_service/api/docs/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/campaign/redoc/ {
        proxy_pass http://campaign_service/api/redoc/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/notifications/ {
        proxy_pass http://notification_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/auth/ {
        proxy_pass http://auth_service/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/donor/ {
        proxy_pass http://donor_service/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/request/ {
        proxy_pass http://request_service/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/campaign/ {
        proxy_pass http://campaign_service/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/notification/ {
        proxy_pass http://notification_service/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
