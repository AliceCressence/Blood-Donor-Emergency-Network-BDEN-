upstream auth_service {
    server 127.0.0.1:18001;
}

upstream donor_service {
    server 127.0.0.1:18002;
}

upstream request_service {
    server 127.0.0.1:18003;
}

upstream campaign_service {
    server 127.0.0.1:18004;
}

upstream notification_service {
    server 127.0.0.1:18005;
}

server {
    listen 8080;
    server_name _;

    client_max_body_size 10m;

    location = / {
        default_type application/json;
        return 200 '{"service":"BDEN API Gateway","status":"ok","docs":"/api/docs/swagger/","health":{"auth":"/health/auth/","donor":"/health/donor/","request":"/health/request/","campaign":"/health/campaign/","notification":"/health/notification/"}}';
    }

    location = /health/ {
        default_type application/json;
        return 200 '{"service":"BDEN API Gateway","status":"ok"}';
    }

    location /api/donor/docs/ {
        proxy_pass http://donor_service/api/docs/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/donor/redoc/ {
        proxy_pass http://donor_service/api/redoc/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/docs/ {
        proxy_pass http://auth_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/schema.json {
        proxy_pass http://auth_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/auth/ {
        proxy_pass http://auth_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/admin/ {
        proxy_pass http://auth_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ${ADMIN_URL}/auth/ {
        proxy_pass http://auth_service/django-admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect /django-admin/ ${ADMIN_URL}/auth/;
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '="/django-admin/' '="${ADMIN_URL}/auth/';
    }

    location ${ADMIN_URL}/donor/ {
        proxy_pass http://donor_service/django-admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect /django-admin/ ${ADMIN_URL}/donor/;
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '="/django-admin/' '="${ADMIN_URL}/donor/';
    }

    location ${ADMIN_URL}/request/ {
        proxy_pass http://request_service/django-admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect /django-admin/ ${ADMIN_URL}/request/;
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '="/django-admin/' '="${ADMIN_URL}/request/';
    }

    location ${ADMIN_URL}/campaign/ {
        proxy_pass http://campaign_service/django-admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect /django-admin/ ${ADMIN_URL}/campaign/;
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '="/django-admin/' '="${ADMIN_URL}/campaign/';
    }

    location ${ADMIN_URL}/notification/ {
        proxy_pass http://notification_service/django-admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect /django-admin/ ${ADMIN_URL}/notification/;
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '="/django-admin/' '="${ADMIN_URL}/notification/';
    }

    location /static/ {
        proxy_pass http://auth_service/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/donors/ {
        proxy_pass http://donor_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/estimation/ {
        proxy_pass http://donor_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/requests/ {
        proxy_pass http://request_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/campaigns/ {
        proxy_pass http://campaign_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/myths/ {
        proxy_pass http://campaign_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ads/ {
        proxy_pass http://campaign_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/campaign/docs/ {
        proxy_pass http://campaign_service/api/docs/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/campaign/redoc/ {
        proxy_pass http://campaign_service/api/redoc/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/notifications/ {
        proxy_pass http://notification_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/auth/ {
        proxy_pass http://auth_service/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/donor/ {
        proxy_pass http://donor_service/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/request/ {
        proxy_pass http://request_service/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/campaign/ {
        proxy_pass http://campaign_service/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/notification/ {
        proxy_pass http://notification_service/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
