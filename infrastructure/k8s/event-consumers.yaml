apiVersion: apps/v1
kind: Deployment
metadata:
  name: donor-event-consumer
  namespace: bden-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: donor-event-consumer
  template:
    metadata:
      labels:
        app: donor-event-consumer
    spec:
      containers:
        - name: donor-event-consumer
          image: localhost:5000/bden/donor-service:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: bden-env
          env:
            - { name: DJANGO_SETTINGS_MODULE, value: config.settings.prod }
            - { name: DEBUG, value: "False" }
            - { name: DONOR_DB_HOST, value: donor-db }
            - { name: DONOR_DB_PORT, value: "5432" }
            - { name: REDIS_URL, value: redis://redis:6379/0 }
            - { name: REDIS_CACHE_URL, value: redis://redis:6379/1 }
            - { name: WAIT_FOR_HOSTS, value: donor-db:5432,redis:6379 }
          command: ["sh", "-c", "python wait_for.py && python manage.py consume_events"]
---
