apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: bden-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: localhost:5000/bden/auth-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
          envFrom:
            - secretRef:
                name: bden-env
          env:
            - { name: DJANGO_SETTINGS_MODULE, value: config.settings.prod }
            - { name: DEBUG, value: "False" }
            - { name: SECURE_SSL_REDIRECT, value: "False" }
            - { name: AUTH_DB_HOST, value: auth-db.bden-prod.svc.cluster.local }
            - { name: AUTH_DB_PORT, value: "5432" }
            - { name: REDIS_URL, value: redis://redis.bden-prod.svc.cluster.local:6379/0 }
            - { name: DONOR_SERVICE_INTERNAL_URL, value: http://donor-service.bden-prod.svc.cluster.local:8002 }
            - { name: WAIT_FOR_HOSTS, value: auth-db.bden-prod.svc.cluster.local:5432,redis.bden-prod.svc.cluster.local:6379 }
            - { name: WAIT_FOR_TIMEOUT, value: "900" }
          command: ["sh", "-c"]
          args:
            - python wait_for.py &&
              python manage.py migrate --noinput &&
              python manage.py collectstatic --no-input &&
              gunicorn config.wsgi:application --bind 0.0.0.0:8001 --workers ${GUNICORN_WORKERS:-3}
          readinessProbe:
            httpGet:
              path: /health/
              port: 8001
              httpHeaders:
                - name: Host
                  value: bden.hinkaku.tech
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          startupProbe:
            httpGet:
              path: /health/
              port: 8001
              httpHeaders:
                - name: Host
                  value: bden.hinkaku.tech
            periodSeconds: 10
            failureThreshold: 90
          livenessProbe:
            httpGet:
              path: /health/
              port: 8001
              httpHeaders:
                - name: Host
                  value: bden.hinkaku.tech
            initialDelaySeconds: 0
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: bden-prod
spec:
  selector:
    app: auth-service
  ports:
    - port: 8001
      targetPort: 8001
---
