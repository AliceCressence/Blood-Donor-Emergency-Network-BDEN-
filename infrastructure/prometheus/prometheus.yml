global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: bden-auth-service
    metrics_path: /metrics/
    static_configs:
      - targets: ["host.docker.internal:18001"]

  - job_name: bden-donor-service
    metrics_path: /metrics/
    static_configs:
      - targets: ["host.docker.internal:18002"]

  - job_name: bden-request-service
    metrics_path: /metrics/
    static_configs:
      - targets: ["host.docker.internal:18003"]

  - job_name: bden-campaign-service
    metrics_path: /metrics/
    static_configs:
      - targets: ["host.docker.internal:18004"]

  - job_name: bden-notification-service
    metrics_path: /metrics/
    static_configs:
      - targets: ["host.docker.internal:18005"]
